<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="template :: head">
	<meta charset="utf-8">
	  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	  <meta name="description" content="">
	  <meta name="author" content="">

	  <title>Spring eCommerce</title>
</head>
<body>
	<header th:replace="template :: header"></header>	
	<div class="container">
		<!-- Page Heading/Breadcrumbs -->
		 <h1 class="mt-4 mb-3">
		   Spring eCommerce <small>Usuarios</small>
		 </h1>

		 <ol class="breadcrumb">
		   <li class="breadcrumb-item"><a th:href="@{/administrador}">Home</a></li>
		   <li class="breadcrumb-item active">Ver Usuarios</li>
		 </ol>
		 <table class="table table-striped table-responsive-md table-bordered">
		   <thead>
		     <tr>
				<th scope="col">ID</th>
															<th scope="col">Nombre</th>
															<th scope="col">EMAIL</th>
															<th scope="col">DIRECCION</th>	
															<th scope="col">TELEFONO</th>
															<th scope="col">TIPO</th>	
		     </tr>
		   </thead>
		   <tbody>		   
				<tr th:each="lp : ${usuarios}">
				<td scope="row"  th:text="${lp.id}"></td>
				<td  scope="row" th:text="${lp.nombre}"></td>
				<td scope="row"  th:text="${lp.email}"></td>
				<td  scope="row" th:text="${lp.direccion}"></td>
				<td scope="row"  th:text="${lp.telefono}"></td> 
				<td scope="row"  th:text="${lp.tipo}"></td> 
				</tr>  
		   </tbody>
		 </table>
		 

	</div>
	<footer th:replace="template :: footer" />
</body>

</html>
