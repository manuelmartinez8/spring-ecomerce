<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head >
	<meta charset="utf-8">
	<meta name="viewport"
		content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description" content="">
	<meta name="author" content="">
<title>Spring Boot App</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
 
</head>
<body> 
	<header th:fragment="header">
		<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		
			<div class="container">			 
				<a class="navbar-brand" th:href="@{/administrador}"><strong>Spring eComerce Administrador</strong></a>
				<form class="d-flex" role="search" method="post" th:action="@{/search}">
					<input class="form-control mr-sm-2" type="search" placeholder="Buscar" aria-label="Search"
						name="nombre" autocomplete="off">
					<button class="btn btn-outline-success " type="submit">Buscar</button>
				</form>
				<button class="navbar-toggler" type="button"
					data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
					aria-controls="navbarSupportedContent" aria-expanded="false"
					aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				
				<!-- ENLACES DEL MENU -->
				<div class="collapse navbar-collapse" id="navbarSupportedContent">
					<ul class="navbar-nav me-auto mb-2 mb-lg-0">						
						<li class="nav-item"><a class="nav-link" th:href="@{/productos/listProduct}">Productos</a></li>
						<li class="nav-item"><a class="nav-link" th:href="@{/productos}"> Gestion Producto</a></li>
						<li class="nav-item"><a class="nav-link" th:href="@{/usuario/listUser}">Lista Usuarios</a></li>
						<li class="nav-item"><a class="nav-link" th:href="@{/administrador/usuarios}">Usuarios</a>
							<li class="nav-item"><a class="nav-link" th:href="@{/administrador/ordenes}">Ordenes</a>
						<li class="nav-item"><a class="nav-link" th:href="@{/usuario/cerrar}">Salir</a></li>			
					</ul>	 
				</div>
			</div>			 
		</nav>		 
		
	</header>




	<!-- CONTENIDO -->
	<div class="container"></div>



	<!-- PIE DE PAGINA -->
	<footer th:fragment="footer" class="bg-dark text-center text-white fixed-bottom">
		<div class="container">
			<p>Copyright Manuelon8 &copy; -2021</p>
		</div>

 

		<!-- Bootstrap 5 JS Bundle (incluye Popper) -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	</footer>
</body>
</html>
