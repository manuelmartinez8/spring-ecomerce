<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="usuario/template_usuario.html :: head"></head>  
<body>
	<!-- Navigation -->
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
		<div class="container">
			<a class="navbar-brand" th:href="@{/}">Spring Ecommerce</a>

			<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive"
				aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarResponsive">
				<ul class="navbar-nav ml-auto">
					<li class="nav-item"><a class="nav-link" th:href="@{/usuario/login}">Login</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>
	<br><br>
	<!-- Page Content -->
	<div class="container">

		<div class="card mb-3">
			<div class="row no-gutters">
				<div class="col-md-4">
				</div>
				<div class="col-md-8">
					<div class="card-body">
						<h2>Ingresar</h2>

					</div>
				</div>
			</div>
		</div>


		<form th:action="@{/usuario/login}" method="post">
			<div class="form-group">
				<label for="username"> Email: </label>
				<input type="email" class="form-control" id="username" name="username" placeholder="Ingrese su email"
					required autocomplete="off">

			</div>

			<div class="form-group">
				<label for="pwd"> Contraseña:</label>
				<input type="password" class="form-control" id="password" name="password"
					placeholder="Ingrese su contraseña" required>
			</div>

			<div class="form-group">
				<div class="col-sm-2">
					<button type="submit" class="btn btn-dark"> <span class="glyphicon glyphicon-ok"></span>
						Ingresar</button>
				</div>
			</div>
			<div th:if="${param.error}">
				<p style="color:red;">Usuario o contraseña inválidos</p>
			</div>

			<div th:if="${param.logout}">
				<p style="color:green;">Has cerrado sesión correctamente</p>
			</div>
		</form>
		<a th:href="@{/usuario/registro}" class="card-link">Si aún no tiene cuenta aqui puede registrarse</a>
	</div>
	<!-- /.container -->
	<br><br>
	<br>

	<footer th:replace="usuario/template_usuario.html :: footer"></footer>  
</body>

</html>
