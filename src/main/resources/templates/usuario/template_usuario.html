<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Spring Boot App</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

</head>

<body>
	<div th:fragment="header">
		<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

			<div class="container">
				<a class="navbar-brand" th:href="@{/}"><strong>Spring eComerce Sin Loguear</strong></a>
				<form class="d-flex" role="search" method="post" th:action="@{/search}">
					<input class="form-control mr-sm-2" type="search" placeholder="Buscar" aria-label="Search"
						name="nombre" autocomplete="off">
					<button class="btn btn-outline-success " type="submit">Buscar</button>
				</form>

				<!-- ENLACES DEL MENU -->
				<div class="collapse navbar-collapse" id="navbarResponsive">
									<ul class="navbar-nav ml-auto">
										<li class="nav-item"><a class="nav-link" th:href="@{/getCart}">Carrito</a></li>
										<li class="nav-item"><a class="nav-link" th:href="@{/usuario/login}">Login</a></li>
									</ul>
								</div>
			</div>
	</div>
	<!--/Header-->
	</nav>
	</div>


	<header th:fragment="header-user">
		<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

			<div class="container">
				<a class="navbar-brand" th:href="@{/}"><strong>Spring eComerce Logueado</strong></a>
				<form class="d-flex" role="search" method="post" th:action="@{/search}">
					<input class="form-control mr-sm-2" type="search" placeholder="Buscar" aria-label="Search"
						name="nombre" autocomplete="off">
					<button class="btn btn-outline-success " type="submit">Buscar</button>
				</form>

				<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
					data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
					aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>

				<div class="collapse navbar-collapse" id="navbarSupportedContent">
					<ul class="navbar-nav me-auto mb-2 mb-lg-0">
						<li class="nav-item"><a class="nav-link" th:href="@{/usuario/compras}">Compras</a></li>
						<li class="nav-item"><a class="nav-link" th:href="@{/getCart}">Carrito</a></li>
						<li class="nav-item"><a class="nav-link" th:href="@{/usuario/cerrar}">Salir</a>
						</li>

					</ul>


				</div>
			</div>
		</nav>
	</header>




	<!-- PIE DE PAGINA -->
	<div th:fragment="footer">
		<footer class="bg-dark text-center text-white fixed-bottom">
			<div class="container">
				<p>Copyright Manuelon8 &copy; -2025</p>
			</div>
			<!-- Bootstrap 5 JS Bundle (incluye Popper) -->
			<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		</footer>
	</div>
</body>

</html>
